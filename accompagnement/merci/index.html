<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paiement reçu | Yousri Bendiabdallah</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141B2E">
<link rel="icon" type="image/png" href="/Logo%20transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Noto+Kufi+Arabic:wght@500;700&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/article.css">
<style>
  .thanks{padding-block:3rem 4rem}
  .thanks .status{
    display:inline-block;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
    font-weight:600;padding:.35rem .8rem;margin-bottom:1.2rem;
    background:rgba(83,50,85,.1);color:var(--plum);
  }
  .thanks .status.ok{background:#e3efe4;color:#24502b}
  .thanks h1{font-size:clamp(2rem,7vw,3rem)}
  .recap{
    margin:1.6rem 0 0;padding:1.1rem 1.2rem;background:#FBF9F4;border:1px solid var(--line);
    display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  }
  .recap strong{font-family:"Bricolage Grotesque", ui-sans-serif, sans-serif}
  .thanks .btn{
    display:flex;align-items:center;justify-content:center;gap:.6rem;
    margin-top:1.8rem;min-height:3.4rem;padding:.8rem 1.5rem;width:100%;max-width:24rem;
    background:#1f8f4e;color:#fff;text-decoration:none;
    font-family:"Bricolage Grotesque", ui-sans-serif, sans-serif;font-weight:700;font-size:1.05rem;
  }
  .thanks .btn:hover{background:#16733d}
  .thanks .btn svg{width:1.3rem;height:1.3rem;flex:none}
  .thanks .ref{margin-top:1.4rem;font-size:.85rem;color:var(--muted);word-break:break-all}
  html[lang="ar"] body{font-family:"Noto Naskh Arabic", serif;font-size:1.1rem;line-height:1.9}
  html[lang="ar"] .display,html[lang="ar"] .btn,html[lang="ar"] .status,html[lang="ar"] .recap strong{
    font-family:"Noto Kufi Arabic", sans-serif;letter-spacing:0;line-height:1.5}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="byousri">
      <img src="/Logo%20transparent.png" alt="" width="128" height="128">
      <span>Yousri Bendiabdallah</span>
    </a>
  </div>
</header>

<main class="wrap reading thanks">
  <p class="status" id="status"></p>
  <h1 class="display" id="title">Merci, votre réservation est confirmée.</h1>
  <p class="standfirst" id="text">Dernière étape : envoyez-moi un message sur WhatsApp pour que nous fixions ensemble le créneau.</p>
  <p class="recap" id="recap" hidden><span id="recap-name"></span><strong id="recap-price"></strong></p>
  <a class="btn" id="wa" href="https://wa.me/+212719597979">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3z"/></svg>
    <span id="wa-label">Prévenir Yousri sur WhatsApp</span>
  </a>
  <p class="ref" id="ref" hidden></p>
</main>

<footer>
  <div class="wrap">
    <p id="footer">© 2026 Yousri Bendiabdallah — Praticien en psychothérapie, Maroc</p>
    <nav aria-label="WhatsApp"><a href="https://wa.me/+212719597979" dir="ltr">WhatsApp — 07 19 59 79 79</a></nav>
  </div>
</footer>

<script>
(function () {
  // Textes communs, puis textes propres à chaque formule (appel, seance, accompagnement).
  var T = {
    fr: {
      doc: 'Paiement reçu | Yousri Bendiabdallah',
      checking: 'Vérification du paiement…', ok: '✓ Paiement confirmé',
      pending: 'Paiement en cours de confirmation', sent: 'Paiement transmis',
      btn: 'Prévenir Yousri sur WhatsApp', ref: 'Référence de paiement : ',
      footer: '© 2026 Yousri Bendiabdallah — Praticien en psychothérapie, Maroc',
      p: {
        appel: {
          name: 'Prise de contact · 30 min', price: '300 DH',
          title: 'Merci, votre prise de contact est réservée.',
          text: 'Dernière étape : envoyez-moi un message sur WhatsApp pour que nous choisissions ensemble le créneau de nos 30 minutes.',
          wa: 'Bonjour Yousri, je viens de réserver la prise de contact de 30 minutes (300 DH). Quand êtes-vous disponible ?'
        },
        seance: {
          name: 'Séance individuelle · 1 h', price: '600 DH',
          title: 'Merci, votre séance est réservée.',
          text: 'Dernière étape : envoyez-moi un message sur WhatsApp pour que nous fixions ensemble la date de votre séance.',
          wa: 'Bonjour Yousri, je viens de réserver une séance d’1 heure (600 DH). Quand êtes-vous disponible ?'
        },
        accompagnement: {
          name: 'Accompagnement · 4 séances + Formation Healing', price: '3 400 DH',
          title: 'Merci, votre accompagnement commence.',
          text: 'Dernière étape : envoyez-moi un message sur WhatsApp. Je vous envoie le questionnaire de démarrage et l’accès à la Formation Healing, puis nous fixons ensemble votre première séance.',
          wa: 'Bonjour Yousri, je viens de régler l’accompagnement (3 400 DH). Je suis prêt·e à commencer.'
        },
        _: {
          title: 'Merci, votre paiement est bien reçu.',
          text: 'Dernière étape : envoyez-moi un message sur WhatsApp pour que nous fixions ensemble la suite.',
          wa: 'Bonjour Yousri, je viens d’effectuer un paiement sur votre site.'
        }
      }
    },
    ar: {
      doc: 'تم استلام الدفع | يسري بنديبدالله',
      checking: 'جارٍ التحقق من الدفع…', ok: '✓ تم تأكيد الدفع',
      pending: 'الدفع في طور التأكيد', sent: 'تم إرسال الدفع',
      btn: 'أخبر يسري عبر واتساب', ref: 'مرجع الدفع: ',
      footer: '© 2026 يسري بنديبدالله — ممارس في العلاج النفسي، المغرب',
      p: {
        appel: {
          name: 'جلسة تعارف · 30 دقيقة', price: '300 درهم',
          title: 'شكراً لك، تم حجز جلسة التعارف.',
          text: 'الخطوة الأخيرة: أرسل لي رسالة عبر واتساب لنختار معاً موعد الثلاثين دقيقة.',
          wa: 'السلام عليكم يسري، لقد حجزت للتو جلسة التعارف لمدة 30 دقيقة (300 درهم). متى تكون متاحاً؟'
        },
        seance: {
          name: 'جلسة فردية · ساعة واحدة', price: '600 درهم',
          title: 'شكراً لك، تم حجز جلستك.',
          text: 'الخطوة الأخيرة: أرسل لي رسالة عبر واتساب لنحدد معاً موعد جلستك.',
          wa: 'السلام عليكم يسري، لقد حجزت للتو جلسة لمدة ساعة (600 درهم). متى تكون متاحاً؟'
        },
        accompagnement: {
          name: 'المرافقة · 4 جلسات + تكوين Healing', price: '3400 درهم',
          title: 'شكراً لك، مرافقتك تبدأ الآن.',
          text: 'الخطوة الأخيرة: أرسل لي رسالة عبر واتساب. سأرسل لك الاستبيان الأولي ورابط الولوج إلى تكوين Healing، ثم نحدد معاً موعد جلستك الأولى.',
          wa: 'السلام عليكم يسري، لقد دفعت للتو ثمن المرافقة (3400 درهم). أنا مستعد للبدء.'
        },
        _: {
          title: 'شكراً لك، تم استلام دفعتك.',
          text: 'الخطوة الأخيرة: أرسل لي رسالة عبر واتساب لنحدد معاً الخطوات التالية.',
          wa: 'السلام عليكم يسري، لقد قمت للتو بعملية دفع على موقعك.'
        }
      }
    },
    en: {
      doc: 'Payment received | Yousri Bendiabdallah',
      checking: 'Checking payment…', ok: '✓ Payment confirmed',
      pending: 'Payment being confirmed', sent: 'Payment submitted',
      btn: 'Let Yousri know on WhatsApp', ref: 'Payment reference: ',
      footer: '© 2026 Yousri Bendiabdallah — Psychotherapy practitioner, Morocco',
      p: {
        appel: {
          name: 'Discovery call · 30 min', price: '300 MAD',
          title: 'Thank you, your discovery call is booked.',
          text: 'Last step: send me a message on WhatsApp so we can pick a time for our 30 minutes.',
          wa: 'Hello Yousri, I have just booked the 30-minute discovery call (300 MAD). When are you available?'
        },
        seance: {
          name: 'Individual session · 1 hour', price: '600 MAD',
          title: 'Thank you, your session is booked.',
          text: 'Last step: send me a message on WhatsApp so we can schedule your session.',
          wa: 'Hello Yousri, I have just booked a 1-hour session (600 MAD). When are you available?'
        },
        accompagnement: {
          name: 'Programme · 4 sessions + Healing course', price: '3,400 MAD',
          title: 'Thank you, your programme begins.',
          text: 'Last step: send me a message on WhatsApp. I will send you the starting questionnaire and access to the Healing course, then we schedule your first session together.',
          wa: 'Hello Yousri, I have just paid for the programme (3,400 MAD). I am ready to start.'
        },
        _: {
          title: 'Thank you, your payment has been received.',
          text: 'Last step: send me a message on WhatsApp so we can plan what comes next.',
          wa: 'Hello Yousri, I have just made a payment on your website.'
        }
      }
    }
  };

  // Adresse de retour YouCan Pay : /accompagnement/merci/<langue>/<formule>/
  var q = new URLSearchParams(location.search);
  var m = location.pathname.match(/\/merci\/(fr|ar|en)(?:\/(appel|seance|accompagnement))?/);
  var lang = (m && m[1]) || (T[q.get('lang')] ? q.get('lang') : 'fr');
  var product = (m && m[2]) || (String(q.get('order_id') || '').split('-')[0]);
  var d = T[lang];
  var $ = function (id) { return document.getElementById(id); };
  var tx = q.get('transaction_id') || '';

  function render(prod) {
    var p = d.p[prod] || d.p._;
    $('title').textContent = p.title;
    $('text').textContent = p.text;
    if (p.name) {
      $('recap-name').textContent = p.name;
      $('recap-price').textContent = p.price;
      $('recap').hidden = false;
    }
    var msg = p.wa + (tx ? ' ' + d.ref + tx : '');
    $('wa').href = 'https://wa.me/+212719597979?text=' + encodeURIComponent(msg);
  }

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = d.doc;
  $('wa-label').textContent = d.btn;
  $('footer').textContent = d.footer;
  if (tx) { $('ref').textContent = d.ref + tx; $('ref').hidden = false; }
  render(product);

  var statusEl = $('status');
  if (!tx) { statusEl.textContent = d.sent; return; }
  statusEl.textContent = d.checking;

  fetch('/api/verifier-paiement?transaction_id=' + encodeURIComponent(tx))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.paid) {
        statusEl.textContent = d.ok;
        statusEl.classList.add('ok');
        if (res.product && res.product !== product) render(res.product);
      } else {
        statusEl.textContent = d.pending;
      }
    })
    .catch(function () { statusEl.textContent = d.sent; });
})();
</script>
</body>
</html>
